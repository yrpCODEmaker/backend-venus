version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: venus_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ENV=production
      - SECRET_KEY=${SECRET_KEY}
      - JWT_ALGORITHM=HS256
      - JWT_EXPIRE_MINUTES=60
    volumes:
      # Montaje de /mnt/db (ubicación principal en Linux)
      - /mnt/db:/mnt/db
      # Montaje de fallback a home (~/venus_storage)
      - ~/.venus_storage:/root/venus_storage
      # Configuración de empresa editable
      - ./company_config.json:/app/company_config.json:ro
