version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: venus_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ENV=production
      - SECRET_KEY=${SECRET_KEY}
      - JWT_ALGORITHM=HS256
      - JWT_EXPIRE_MINUTES=60
      - ADMIN_DEFAULT_USERNAME=${ADMIN_DEFAULT_USERNAME:-pichardo}
      - ADMIN_DEFAULT_PASSWORD=${ADMIN_DEFAULT_PASSWORD:-admin123}
      # Rutas de almacenamiento persistente en el volumen /mnt/db del VPS
      - DATABASE_PATH=/mnt/db/venus.db
      - UPLOAD_DIR=/mnt/db/uploads
      - COMPANY_CONFIG_PATH=/mnt/db/company_config.json
    volumes:
      # Montaje del volumen de almacenamiento extra del VPS en /mnt/db
      - /mnt/db:/mnt/db

